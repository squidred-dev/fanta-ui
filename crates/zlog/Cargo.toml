[package]
name = "fanta-gpui-zlog"
version = "0.3.0"
edition = "2024"
publish = true
license = "GPL-3.0-or-later"
repository = "https://github.com/squidred-dev/fanta-ui"
description = "Fanta GPUI fork of zlog"

[lib]
path = "src/zlog.rs"
name = "zlog"

[features]
default = []

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[dependencies.collections]
path = "../collections"
version = "=0.3.0"
package = "fanta-gpui-collections"

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.log]
version = "0.4.16"
features = [ "kv_unstable_serde", "serde",]

[dependencies.anyhow]
version = "1.0.86"

[dev-dependencies.tempfile]
version = "3.20.0"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
