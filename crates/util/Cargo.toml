[package]
name = "fanta-gpui-util"
version = "0.2.0"
edition = "2024"
publish = true
license = "Apache-2.0"
description = "A collection of utility structs and functions used by Zed and GPUI"
repository = "https://github.com/squidred-dev/fanta-ui"

[lib]
path = "src/util.rs"
doctest = true
name = "util"

[features]
test-support = [ "rand", "util_macros",]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async_zip]
version = "0.0.18"
features = [ "deflate", "deflate64",]

[dependencies.collections]
path = "../collections"
version = "=0.2.0"
package = "fanta-gpui-collections"

[dependencies.dunce]
version = "1.0"

[dependencies.futures-lite]
version = "1.13"

[dependencies.futures]
version = "0.3.32"

[dependencies.globset]
version = "0.4"

[dependencies.itertools]
version = "0.14.0"

[dependencies.log]
version = "0.4.16"
features = [ "kv_unstable_serde", "serde",]

[dependencies.rand]
version = "0.9"
optional = true

[dependencies.regex]
version = "1.5"

[dependencies.rust-embed]
version = "8.11"
features = [ "include-exclude",]

[dependencies.schemars]
version = "1.0"
features = [ "indexmap2",]

[dependencies.serde]
version = "1.0.221"
features = [ "derive", "rc",]

[dependencies.serde_json]
version = "1.0.144"
features = [ "preserve_order", "raw_value",]

[dependencies.serde_json_lenient]
version = "0.2"
features = [ "preserve_order", "raw_value",]

[dependencies.shlex]
version = "1.3.0"

[dependencies.take-until]
version = "0.2.0"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.unicase]
version = "2.6"

[dependencies.url]
version = "2.2"

[dependencies.percent-encoding]
version = "2.3.2"

[dependencies.util_macros]
path = "../util_macros"
optional = true
package = "fanta-gpui-util-macros"
version = "=0.2.0"

[dependencies.gpui_util]
path = "../gpui_util"
package = "fanta-gpui-gpui-util"
version = "=0.2.0"

[dev-dependencies.rand]
version = "0.9"

[dev-dependencies.util_macros]
path = "../util_macros"
package = "fanta-gpui-util-macros"
version = "=0.2.0"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = [ "unstable",]

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"

[target."cfg(unix)".dependencies]
command-fds = "0.3.1"

[target."cfg(windows)".dependencies]
tendril = "0.4.3"

[target."cfg(unix)".dependencies.libc]
version = "0.2"

[target."cfg(unix)".dependencies.nix]
version = "0.29"
features = [ "user",]

[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = [ "Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectManipulation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Hlsl", "Win32_Graphics_Imaging", "Win32_Media", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",]

[target."cfg(not(target_family = \"wasm\"))".dependencies.smol]
version = "=0.2.0"
package = "fanta-gpui-smol"
path = "../smol"

[target."cfg(not(target_family = \"wasm\"))".dependencies.which]
version = "6.0.0"

[target."cfg(not(target_family = \"wasm\"))".dependencies.async-fs]
version = "2.1"

[target."cfg(not(target_family = \"wasm\"))".dependencies.walkdir]
version = "2.5"

[target."cfg(not(target_family = \"wasm\"))".dependencies.dirs]
version = "6.0"

[target."cfg(target_os = \"macos\")".dependencies.mach2]
version = "0.5"
