[package]
name = "fanta-gpui-ztracing"
version = "0.4.1"
edition = "2024"
publish = true
license = "GPL-3.0-or-later"
repository = "https://github.com/squidred-dev/fanta-ui"
description = "Fanta GPUI fork of ztracing"

[features]
tracy = [ "tracing-tracy", "tracy-client",]

[dependencies]
tracing-subscriber = "0.3.22"

[lib]
name = "ztracing"

[dependencies.zlog]
path = "../zlog"
package = "fanta-gpui-zlog"
version = "=0.4.1"

[dependencies.tracing]
version = "0.1.40"

[dependencies.tracing-tracy]
version = "0.11.4"
optional = true
features = [ "enable", "ondemand",]

[dependencies.tracy-client]
version = "0.18.2"
optional = true
features = [ "enable", "ondemand",]

[dependencies.ztracing_macro]
path = "../ztracing_macro"
package = "fanta-gpui-ztracing-macro"
version = "=0.4.1"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
