[package]
name = "fanta-gpui"
description = "Engine-decoupled, host-controlled GPUI components for Fanta applications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
# Official Lucide release and SVG path parser. Fanta renders this pinned
# catalog directly instead of maintaining a second, hand-drawn icon set.
lucide-static-svg = { version = "=1.45.0", default-features = false, features = ["svg"] }
lyon = "1.0"
roxmltree = "0.20"
svgtypes = "0.16.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
