[package]
name = "fanta-gpui-gpui-windows"
version = "0.4.1"
edition = "2024"
publish = true
license = "Apache-2.0"
repository = "https://github.com/squidred-dev/fanta-ui"
description = "Fanta GPUI fork of gpui_windows"

[lib]
path = "src/gpui_windows.rs"
name = "gpui_windows"

[features]
default = [ "gpui/default",]
test-support = [ "gpui/test-support",]
screen-capture = [ "gpui/screen-capture", "scap",]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[dependencies.gpui]
path = "../gpui"
default-features = false
package = "fanta-gpui-core"
version = "=0.4.1"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"

[target."cfg(target_os = \"windows\")".dependencies]
etagere = "0.2"
raw-window-handle = "0.6"
windows-numerics = "0.2"
windows-registry = "0.5"

[target."cfg(target_os = \"windows\")".build-dependencies]
windows-registry = "0.5"

[target."cfg(target_os = \"windows\")".dependencies.accesskit]
version = "0.24.0"

[target."cfg(target_os = \"windows\")".dependencies.accesskit_windows]
version = "0.33.1"

[target."cfg(target_os = \"windows\")".dependencies.anyhow]
version = "1.0.86"

[target."cfg(target_os = \"windows\")".dependencies.collections]
path = "../collections"
version = "=0.4.1"
package = "fanta-gpui-collections"

[target."cfg(target_os = \"windows\")".dependencies.dunce]
version = "1.0"

[target."cfg(target_os = \"windows\")".dependencies.futures]
version = "0.3.32"

[target."cfg(target_os = \"windows\")".dependencies.gpui_util]
path = "../gpui_util"
package = "fanta-gpui-gpui-util"
version = "=0.4.1"

[target."cfg(target_os = \"windows\")".dependencies.image]
version = "0.25.1"

[target."cfg(target_os = \"windows\")".dependencies.itertools]
version = "0.14.0"

[target."cfg(target_os = \"windows\")".dependencies.log]
version = "0.4.16"
features = [ "kv_unstable_serde", "serde",]

[target."cfg(target_os = \"windows\")".dependencies.parking_lot]
version = "0.12.1"

[target."cfg(target_os = \"windows\")".dependencies.rand]
version = "0.9"

[target."cfg(target_os = \"windows\")".dependencies.smallvec]
version = "1.6"
features = [ "const_new", "union",]

[target."cfg(target_os = \"windows\")".dependencies.uuid]
version = "1.1.2"
features = [ "serde", "v4", "v5", "v7",]

[target."cfg(target_os = \"windows\")".dependencies.windows]
version = "0.61"
features = [ "Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectManipulation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Hlsl", "Win32_Graphics_Imaging", "Win32_Media", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",]

[target."cfg(target_os = \"windows\")".dependencies.windows-core]
version = "0.61"

[target."cfg(target_os = \"windows\")".dependencies.scap]
default-features = false
package = "zed-scap"
version = "0.0.8-zed"
optional = true
