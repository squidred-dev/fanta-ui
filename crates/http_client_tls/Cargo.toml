[package]
name = "fanta-gpui-http-client-tls"
version = "0.4.1"
edition = "2024"
publish = true
license = "Apache-2.0"
repository = "https://github.com/squidred-dev/fanta-ui"
description = "Fanta GPUI fork of http_client_tls"

[features]
test-support = []

[lib]
path = "src/http_client_tls.rs"
doctest = true
name = "http_client_tls"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[dependencies.rustls]
version = "0.23.26"

[dependencies.rustls-platform-verifier]
version = "0.5.0"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
