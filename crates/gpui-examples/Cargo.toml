[package]
name = "fanta-gpui-examples"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
async-task = "4.7"
etagere = "0.2"
num_cpus = "1.13"
parking = "2.0.0"
raw-window-handle = "0.6"
ttf-parser = "0.25"
seahash = "4.1"
taffy = "=0.10.1"
waker-fn = "1.2.0"
pin-project = "1.1.10"
spin = "0.10.0"

[dependencies.backtrace]
version = "0.3"

[dependencies.collections]
path = "../collections"
version = "=0.3.0"
features = [ "test-support",]
package = "fanta-gpui-collections"

[dependencies.env_logger]
version = "0.11"

[dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false
features = [ "font-kit", "wayland", "x11",]
package = "fanta-gpui-gpui-platform"
version = "=0.3.0"

[dependencies.gpui_util]
path = "../gpui_util"
package = "fanta-gpui-gpui-util"
version = "=0.3.0"

[dependencies.lyon]
version = "1.0"
features = [ "extra",]

[dependencies.rand]
version = "0.9"

[dependencies.scheduler]
path = "../scheduler"
features = [ "test-support",]
package = "fanta-gpui-scheduler"
version = "=0.3.0"

[dependencies.unicode-segmentation]
version = "1.10"

[dependencies.gpui]
package = "fanta-gpui-core"
path = "../gpui"
features = [ "test-support",]

[dependencies.accesskit]
version = "0.24.0"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.bitflags]
version = "2.6.0"
optional = true

[dependencies.criterion]
version = "0.5"
features = [ "html_reports",]
optional = true

[dependencies.ctor]
version = "1.0.6"

[dependencies.derive_more]
version = "2.1.1"
features = [ "add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not",]

[dependencies.futures]
version = "0.3.32"

[dependencies.futures-concurrency]
version = "7.7.1"

[dependencies.gpui_macros]
path = "../gpui_macros"
package = "fanta-gpui-gpui-macros"
version = "=0.3.0"

[dependencies.gpui_shared_string]
path = "../gpui_shared_string"
package = "fanta-gpui-gpui-shared-string"
version = "=0.3.0"

[dependencies.http_client]
path = "../http_client"
package = "fanta-gpui-http-client"
version = "=0.3.0"

[dependencies.image]
version = "0.25.1"

[dependencies.inventory]
version = "0.3.19"

[dependencies.itertools]
version = "0.14.0"

[dependencies.log]
version = "0.4.16"
features = [ "kv_unstable_serde", "serde",]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.postage]
version = "0.5"
features = [ "futures-traits",]

[dependencies.proptest]
optional = true
version = "=0.3.0"
features = [ "attr-macro",]
package = "fanta-gpui-proptest"
path = "../proptest"

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.profiling]
version = "1"

[dependencies.regex]
version = "1.5"

[dependencies.refineable]
path = "../refineable"
package = "fanta-gpui-refineable"
version = "=0.3.0"

[dependencies.resvg]
version = "0.46.0"
default-features = false
features = [ "memmap-fonts", "raster-images", "system-fonts", "text",]

[dependencies.usvg]
version = "0.46.0"
default-features = false

[dependencies.util_macros]
path = "../util_macros"
package = "fanta-gpui-util-macros"
version = "=0.3.0"

[dependencies.schemars]
version = "1.0"
features = [ "indexmap2",]

[dependencies.serde]
version = "1.0.221"
features = [ "derive", "rc",]

[dependencies.serde_json]
version = "1.0.144"
features = [ "preserve_order", "raw_value",]

[dependencies.slotmap]
version = "1.0.6"

[dependencies.smallvec]
version = "1.6"
features = [ "const_new", "union",]

[dependencies.async-channel]
version = "2.5.0"

[dependencies.stacksafe]
version = "0.1"

[dependencies.strum]
version = "0.27.2"
features = [ "derive",]

[dependencies.sum_tree]
path = "../sum_tree"
package = "fanta-gpui-sum-tree"
version = "=0.3.0"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.hdrhistogram]
version = "7"
optional = true

[dependencies.pollster]
version = "0.4.0"

[dependencies.url]
version = "2.2"

[dependencies.uuid]
version = "1.1.2"
features = [ "serde", "v4", "v5", "v7",]

[dependencies.web-time]
version = "1.1.0"

[dependencies.heapless]
version = "0.9.2"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"

[target."cfg(target_family = \"wasm\")".dependencies.wasm-bindgen]
version = "0.2.120"

[target."cfg(target_family = \"wasm\")".dependencies.gpui_web]
path = "../gpui_web"
package = "fanta-gpui-gpui-web"
version = "=0.3.0"

[target."cfg(not(target_family = \"wasm\"))".dependencies.http_client]
path = "../http_client"
features = [ "test-support",]
package = "fanta-gpui-http-client"
version = "=0.3.0"

[target."cfg(not(target_family = \"wasm\"))".dependencies.proptest]
version = "=0.3.0"
package = "fanta-gpui-proptest"
path = "../proptest"

[target."cfg(not(target_family = \"wasm\"))".dependencies.reqwest_client]
path = "../reqwest_client"
features = [ "test-support",]
package = "fanta-gpui-reqwest-client"
version = "=0.3.0"
