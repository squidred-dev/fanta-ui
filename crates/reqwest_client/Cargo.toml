[package]
name = "fanta-gpui-reqwest-client"
version = "0.3.0"
edition = "2024"
publish = true
license = "Apache-2.0"
repository = "https://github.com/squidred-dev/fanta-ui"
description = "Fanta GPUI fork of reqwest_client"

[features]
test-support = []

[lib]
path = "src/reqwest_client.rs"
doctest = true
name = "reqwest_client"

[dev-dependencies]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.bytes]
version = "1.0"

[dependencies.futures]
version = "0.3.32"

[dependencies.http_client]
path = "../http_client"
package = "fanta-gpui-http-client"
version = "=0.3.0"

[dependencies.serde]
version = "1.0.221"
features = [ "derive", "rc",]

[dependencies.log]
version = "0.4.16"
features = [ "kv_unstable_serde", "serde",]

[dependencies.tokio]
version = "1"
features = [ "rt", "rt-multi-thread",]

[dependencies.regex]
version = "1.5"

[dependencies.reqwest]
default-features = false
features = [ "charset", "http2", "macos-system-configuration", "multipart", "rustls-tls-native-roots", "socks", "stream",]
package = "zed-reqwest"
version = "0.12.15-zed"

[dependencies.gpui_util]
path = "../gpui_util"
package = "fanta-gpui-gpui-util"
version = "=0.3.0"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"

[target."cfg(not(target_family = \"wasm\"))".dependencies.http_client_tls]
path = "../http_client_tls"
package = "fanta-gpui-http-client-tls"
version = "=0.3.0"
