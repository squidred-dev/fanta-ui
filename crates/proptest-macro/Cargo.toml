[package]
name = "fanta-gpui-proptest-macro"
description = "Procedural macros for the proptest crate"
version = "0.3.0"
authors = [ "The Proptest Developers",]
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
repository = "https://github.com/squidred-dev/fanta-ui"
homepage = "https://proptest-rs.github.io/proptest/proptest/index.html"
keywords = [ "property", "testing", "quickcheck", "fuzz", "hypothesis",]
categories = [ "development-tools::testing",]
publish = true

[lib]
proc-macro = true
name = "proptest_macro"

[dependencies.syn]
version = "2.0.114"
features = [ "full",]

[dependencies.quote]
version = "1.0"

[dependencies.proc-macro2]
version = "1.0"

[dependencies.convert_case]
version = "0.11"

[dev-dependencies.insta]
version = "1"

[dev-dependencies.prettyplease]
version = "0.2"

[lints.clippy]
# Preserve the upstream macro documentation while using the workspace toolchain.
doc_lazy_continuation = "allow"
