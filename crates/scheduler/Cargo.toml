[package]
name = "fanta-gpui-scheduler"
version = "0.4.0"
edition = "2024"
publish = true
license = "Apache-2.0"
repository = "https://github.com/squidred-dev/fanta-ui"
description = "Fanta GPUI fork of scheduler"

[lib]
path = "src/scheduler.rs"
doctest = false
name = "scheduler"

[features]
test-support = []

[dependencies]
flume = "0.11"

[dependencies.async-task]
version = "4.7"

[dependencies.backtrace]
version = "0.3"

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.futures]
version = "0.3.32"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.rand]
version = "0.9"

[dependencies.web-time]
version = "1.1.0"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
