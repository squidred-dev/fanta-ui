[package]
name = "fanta-gpui-gpui-shared-string"
version = "0.4.0"
publish = true
edition = "2024"
repository = "https://github.com/squidred-dev/fanta-ui"
description = "Fanta GPUI fork of gpui_shared_string"
license = "Apache-2.0"

[lib]
path = "gpui_shared_string.rs"
name = "gpui_shared_string"

[dependencies]
smol_str = "0.3.6"

[dependencies.schemars]
version = "1.0"
features = [ "indexmap2",]

[dependencies.serde]
version = "1.0.221"
features = [ "derive", "rc",]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
