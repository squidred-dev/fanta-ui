[package]
name = "fanta-gpui-refineable"
version = "0.3.0"
edition = "2024"
publish = true
license = "Apache-2.0"
description = "A macro for creating 'refinement' types that can be used to partially initialize or mutate a complex struct"
repository = "https://github.com/squidred-dev/fanta-ui"

[lib]
path = "src/refineable.rs"
doctest = false
name = "refineable"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[dependencies.derive_refineable]
path = "derive_refineable"
package = "fanta-gpui-derive-refineable"
version = "=0.3.0"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
