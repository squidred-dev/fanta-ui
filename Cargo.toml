[workspace]
resolver = "2"
members = [
    "crates/fanta-gpui",
    "crates/fanta-gpui-storybook",
]
default-members = ["crates/fanta-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0"
repository = "https://github.com/squidred-dev/fanta-gpui"

[workspace.dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
# The storybook launches through Zed's platform factory; keep native macOS text
# rendering plus both Linux backends enabled from the same manifest.
gpui_platform = { path = "../fanta-edit/crates/gpui_platform", features = ["font-kit", "wayland", "x11"] }
# gpui-component-assets' derive uses include/exclude filters; this direct entry
# intentionally unifies rust-embed's feature set for the storybook build.
rust-embed = { version = "8.12", features = ["include-exclude"] }

fanta-gpui = { path = "crates/fanta-gpui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }

[patch.crates-io]
gpui = { path = "../fanta-edit/crates/gpui" }
gpui-component = { path = "../fanta-edit/crates/gpui_component" }
